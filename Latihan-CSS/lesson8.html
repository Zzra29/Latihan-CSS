<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 8 Exercises</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    padding:20px;
}

/* 8A */
.no1,
.no2{
    width:150px;
    height:30px;
    border:none;
    box-shadow:0 0 2px rgb(70,70,70);
    padding-left:8px;
}

.no1{
    display:block;
    margin-bottom:5px;
}

/* 8C */
.google-logo{
    display:block;
    margin:0 auto;
    width:200px;
}

.class1{
    width:500px;
    height:40px;
    border:none;
    border-radius:23px;
    box-shadow:0 0 3px gray;
    padding-left:20px;
    outline:none;
    display:block;
    margin:0 auto;
}

/* Challenge Title */
.challenge-title{
    color:red;
    text-decoration:underline;
}

/* 8D */
.class0,
.class2{
    width:130px;
    height:40px;
    border:none;
    border-radius:8px;
    box-shadow:0 0 2px black;
    outline:none;
    padding-left:10px;
}

.class3{
    width:265px;
    height:40px;
    border:none;
    border-radius:8px;
    box-shadow:0 0 2px black;
    outline:none;
    padding-left:10px;
    display:block;
    margin:10px 0;
}

.btn-submit{
    width:265px;
    height:40px;
    background:rgb(9,116,255);
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-submit:hover{
    opacity:.8;
}

/* 8E */
.input1,
.input2{
    width:300px;
    height:40px;
    border:none;
    background:rgb(227,225,225);
    outline:none;
    display:block;
    padding-left:10px;
    font-size:12px;
}

.input1{
    margin-bottom:5px;
}

.input2{
    margin-bottom:25px;
}

.btn1{
    width:100px;
    height:40px;
    background:black;
    color:white;
    border:none;
    cursor:pointer;
    margin-right:5px;
}

.btn1:hover{
    background:#2e2e2e;
}

.btn2{
    width:120px;
    height:40px;
    background:rgb(227,225,225);
    border:none;
    cursor:pointer;
}

.btn2:hover{
    background:rgb(194,190,190);
}
</style>
</head>

<body>

<h3>8A.</h3>

<input type="text" placeholder="Name" class="no1">
<input type="text" placeholder="Email" class="no2">

<hr>

<h3>8B.</h3>

<p>
    Thanks for chatting with our customer support.
    Would you like to take our quick survey?
    <button>Yes</button>
    <button>No</button>
</p>

<hr>

<h3>8C.</h3>

<img src="Google.png" alt="Google" class="google-logo">

<br>

<input
    type="text"
    placeholder="Search Google or type a URL"
    class="class1">

<hr>

<h1 class="challenge-title">
    Challenge Exercise
</h1>

<h3>8D.</h3>

<input type="text" placeholder="First Name" class="class0">
<input type="text" placeholder="Last Name" class="class2">

<input type="text" placeholder="Email" class="class3">

<button class="btn-submit">
    Sign Up
</button>

<hr>

<h3>8E.</h3>

<h2>Request a ride now</h2>

<input
    type="text"
    placeholder="Enter pickup location"
    class="input1">

<input
    type="text"
    placeholder="Enter destination"
    class="input2">

<button class="btn1">
    Request now
</button>

<button class="btn2">
    Schedule for later
</button>

</body>
</html>
