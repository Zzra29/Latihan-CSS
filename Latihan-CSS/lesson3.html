<!DOCTYPE html>

<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 3 Exercises</title>

<style>
body{
    font-family: Arial, sans-serif;
}

.btn-kotak{
    width:120px;
    height:50px;
    background:black;
    color:white;
    border:none;
    cursor:pointer;
}

.btn-kotak:hover{
    opacity:0.8;
}

.btn-lonjong{
    width:200px;
    height:50px;
    background:rgb(255,216,20);
    border:none;
    border-radius:50px;
    cursor:pointer;
}

.btn-lonjong:hover{
    opacity:0.8;
}

.btn-github{
    width:120px;
    height:50px;
    background:rgb(46,164,79);
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 0 2px rgba(0,0,0,.5);
}

.btn-github:hover{
    opacity:0.8;
}

.btn-bootstrap{
    width:120px;
    height:40px;
    background:rgb(121,82,179);
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

.btn-bootstrap:hover{
    background:rgb(105,69,159);
}

.btn-download{
    width:120px;
    height:40px;
    background:white;
    color:gray;
    border:1px solid rgb(108,117,125);
    border-radius:4px;
    font-weight:bold;
    cursor:pointer;
}

.btn-download:hover{
    background:gray;
    color:white;
}

.btn-linkedin{
    width:300px;
    height:40px;
    background:rgb(10,102,194);
    color:white;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.btn-linkedin:hover{
    background:rgb(2,38,111);
}

.btn-save{
    width:100px;
    height:40px;
    background:white;
    color:rgb(10,102,194);
    border:1px solid rgb(10,102,194);
    border-radius:20px;
    cursor:pointer;
}

.btn-save:hover{
    background:rgb(183,229,249);
}

.btn-add{
    width:120px;
    height:40px;
    background:rgb(255,216,20);
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.btn-add:hover{
    opacity:0.8;
}

.btn-buy{
    width:120px;
    height:40px;
    background:rgb(255,164,28);
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.btn-buy:hover{
    opacity:0.8;
}

.stock{
    color:rgb(0,118,0);
    font-weight:bold;
}
</style>

</head>

<body>

<h1><u>Lesson 3 Exercises - Hovers, Transitions and Shadows</u></h1>

<p>3a. Uber</p>
<button class="btn-kotak">Request Now</button>

<hr>

<p>3b. Amazon</p>
<a href="https://www.amazon.com" target="_blank">
    <button class="btn-lonjong">Add to Cart</button>
</a>

<hr>

<p>3c. GitHub</p>
<button class="btn-github">Sign Up</button>

<hr>

<p>3d. Bootstrap</p>
<button class="btn-bootstrap">Get Started</button>
<button class="btn-download">Download</button>

<hr>

<p>3e. LinkedIn</p>
<button class="btn-linkedin">Apply on company website</button>
<button class="btn-save">Save</button>

<hr>

<h1 style="color:red;">
    <u>Challenge Exercise</u>
</h1>

<p>3f.</p>

<a href="https://www.amazon.com" target="_blank">
    Back to Amazon
</a>

<h1>Nike Black Running Shoes</h1>

<h3 class="stock">
    $39 - in stock.
</h3>

<h3>
    Free delivery tomorrow.
</h3>

<button class="btn-add">
    Add to Cart
</button>

<button class="btn-buy">
    Buy Now
</button>

</body>
</html>
