<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 2 Exercises</title>

<style>
body{
    font-family: Arial, sans-serif;
}

.btn-kotak{
    width:120px;
    height:50px;
    background-color:black;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
}

.btn-lonjong{
    width:200px;
    height:50px;
    background-color:rgb(255,216,20);
    border:none;
    border-radius:50px;
    font-size:16px;
    cursor:pointer;
}

.btn-github{
    width:120px;
    height:50px;
    background-color:rgb(46,164,79);
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.btn-bootstrap{
    width:120px;
    height:40px;
    background-color:rgb(121,82,179);
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

.btn-download{
    width:120px;
    height:40px;
    background-color:white;
    border:1px solid rgb(108,117,125);
    cursor:pointer;
}

.btn-linkedin{
    width:300px;
    height:40px;
    background-color:rgb(10,102,194);
    color:white;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.btn-save{
    width:100px;
    height:40px;
    background-color:white;
    color:rgb(10,102,194);
    border:1px solid rgb(10,102,194);
    border-radius:20px;
    cursor:pointer;
}

.btn-add{
    width:120px;
    height:40px;
    background-color:rgb(255,216,20);
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.btn-buy{
    width:120px;
    height:40px;
    background-color:rgb(255,164,28);
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.stock{
    color:rgb(0,118,0);
    font-weight:bold;
}
</style>

</head>

<body>

<h1><u>Lesson 2 Exercises - CSS Basic</u></h1>

<p>2a. Uber</p>
<button class="btn-kotak">Request Now</button>

<hr>

<p>2b. Amazon</p>
<a href="https://www.amazon.com" target="_blank">
    <button class="btn-lonjong">Add to Cart</button>
</a>

<hr>

<p>2c. GitHub</p>
<button class="btn-github">Sign Up</button>

<hr>

<p>2d. Bootstrap</p>
<button class="btn-bootstrap">Get Started</button>
<button class="btn-download">Download</button>

<hr>

<p>2e. LinkedIn</p>
<button class="btn-linkedin">Apply on company website</button>
<button class="btn-save">Save</button>

<hr>

<h1 style="color:red;">
    <u>Challenge Exercise</u>
</h1>

<p>2f. Continuing from exercise 1g.</p>

<a href="https://www.amazon.com" target="_blank">
    Back to Amazon
</a>

<h1>Nike Black Running Shoes</h1>

<h3 class="stock">$39 - in stock.</h3>

<h3>Free delivery tomorrow.</h3>

<button class="btn-add">Add to Cart</button>
<button class="btn-buy">Buy Now</button>

</body>

</html>
