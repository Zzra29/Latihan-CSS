
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 9 Exercises</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:white;
    padding:20px;
}

h1{
    text-decoration:underline;
    margin-bottom:20px;
}

h3{
    margin-bottom:10px;
}

.exercise{
    margin-bottom:30px;
}

/* 9A */
.box{
    width:50px;
    height:50px;
    background:red;
}

/* 9B */
.square{
    width:50px;
    height:50px;
    background:rgb(2,149,51);
    border-radius:50%;
}

/* 9C */
.border{
    width:300px;
    border:2px solid rgb(207,207,207);
    padding:15px;
}

.border button{
    cursor:pointer;
}

/* 9D */
.border2{
    width:300px;
    background:rgb(29,29,29);
    color:white;
    padding:15px;
}

.border2 p{
    color:gray;
    margin-top:10px;
}

/* 9E */
.borderr{
    width:340px;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 3px rgb(120,120,120);
}

.profile{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    vertical-align:middle;
}

.input{
    width:200px;
    border:none;
    outline:none;
    margin:0 10px;
    vertical-align:middle;
}

.btn-tweet{
    background:rgb(20,125,237);
    color:white;
    border:none;
    border-radius:15px;
    padding:8px 15px;
    cursor:pointer;
}

/* Challenge */
.challenge{
    color:red;
    text-decoration:underline;
    margin-bottom:20px;
}

/* 9F & 9G */
.friend-card{
    width:170px;
    box-shadow:0 0 4px rgba(0,0,0,.3);
    display:inline-block;
    margin-right:10px;
    vertical-align:top;
}

.friend-card img{
    width:100%;
    height:170px;
    object-fit:cover;
}

.friend-info{
    padding:10px;
}

.name{
    font-weight:bold;
    margin-bottom:5px;
}

.mutual{
    color:gray;
    font-size:14px;
    margin-bottom:10px;
}

.btn{
    background:rgb(19,113,206);
    color:white;
    border:none;
    border-radius:4px;
    padding:8px 14px;
    cursor:pointer;
}

.btn:hover{
    background:rgb(20,125,237);
}

/* 9H */
.last{
    text-align:center;
}

.google-search{
    width:500px;
    height:40px;
    border:none;
    border-radius:23px;
    box-shadow:0 0 3px gray;
    padding-left:20px;
    outline:none;
    margin:15px 0;
}

.btn2{
    width:130px;
    height:40px;
    border:none;
    background:rgb(227,225,225);
    cursor:pointer;
}

.btn2:hover{
    box-shadow:0 0 3px rgb(70,70,70);
}
</style>
</head>

<body>

<h1>Lesson 9 Exercises</h1>

<div class="exercise">
    <h3>9A.</h3>
    <div class="box"></div>
</div>

<hr><br>

<div class="exercise">
    <h3>9B.</h3>
    <div class="square"></div>
</div>

<hr><br>

<div class="exercise">
    <h3>9C.</h3>

    <div class="border">
        <h3>Satisfied with our service?</h3>
        <button>Yes</button>
        <button>No</button>
    </div>
</div>

<hr><br>

<div class="exercise">
    <h3>9D.</h3>

    <div class="border2">
        <h3>Install YouTube Music</h3>
        <p>
            Add YouTube Music to your desktop for quick
            and easy access.
        </p>
    </div>
</div>

<hr><br>

<div class="exercise">
    <h3>9E.</h3>

    <div class="borderr">
        <img src="img.png" alt="Profile" class="profile">
        <input type="text" placeholder="What's happening?" class="input">
        <button class="btn-tweet">Tweet</button>
    </div>
</div>

<hr><br>

<h1 class="challenge">Challenge Exercise</h1>

<div class="exercise">
    <h3>9F.</h3>

    <div class="friend-card">
        <img src="Fotos.png" alt="Oliver">

        <div class="friend-info">
            <p class="name">Oliver</p>
            <p class="mutual">2 mutual friends</p>
            <button class="btn">Add Friend</button>
        </div>
    </div>
</div>

<hr><br>

<div class="exercise">
    <h3>9G.</h3>

    <div class="friend-card">
        <img src="Fotos.png" alt="Oliver">

        <div class="friend-info">
            <p class="name">Oliver</p>
            <p class="mutual">2 mutual friends</p>
            <button class="btn">Add Friend</button>
        </div>
    </div>

    <div class="friend-card">
        <img src="Fotos2.png" alt="Mimi">

        <div class="friend-info">
            <p class="name">Mimi</p>
            <p class="mutual">3 mutual friends</p>
            <button class="btn">Add Friend</button>
        </div>
    </div>

    <div class="friend-card">
        <img src="Fotos3.jpg" alt="Rex">

        <div class="friend-info">
            <p class="name">Rex</p>
            <p class="mutual">4 mutual friends</p>
            <button class="btn">Add Friend</button>
        </div>
    </div>
</div>

<hr><br>

<div class="exercise">
    <h3>9H.</h3>

    <div class="last">

        <img src="Google.png" alt="Google" width="200">

        <br>

        <input
            type="text"
            placeholder="Search Google or type a URL"
            class="google-search">

        <br>

        <button class="btn2">Google Search</button>
        <button class="btn2">I'm Feeling Lucky</button>

    </div>
</div>

</body>
</html>
